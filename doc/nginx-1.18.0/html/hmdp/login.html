<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>HM DianPing</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/login.css" rel="stylesheet">
</head>
<body>
<div id="app">
  <div class="login-container">
    <div class="header">
      <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
      <div class="header-title">Code Login</div>
    </div>
    <div class="content">
      <div class="login-form">
        <div style="display: flex; justify-content: space-between">
          <el-input style="width: 60%" placeholder="Phone" v-model="form.phone"></el-input>
          <el-button style="width: 38%" @click="sendCode" type="success" :disabled="disabled">{{codeBtnMsg}}</el-button>
        </div>
        <div style="height: 5px"></div>
        <el-input placeholder="Verification code" v-model="form.code"></el-input>
        <div style="text-align: center; color: #8c939d; margin: 5px 0">Unregistered phone numbers will create an account automatically.</div>
        <el-button @click="login" style="width: 100%; background-color:#f63; color: #fff;">Login</el-button>
        <div style="text-align: right; color:#333333; margin: 5px 0"><a href="/login2.html">Password login</a></div>
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data() {
      return {
        disabled: false,
        codeBtnMsg: "Send code",
        form: {}
      };
    },
    methods: {
      login() {
        if (!this.form.phone || !this.form.code) {
          this.$message.error("Phone and code are required");
          return;
        }
        console.log("Sending login request with:", this.form);
        axios.post("/user/login", this.form)
                .then(({data, headers}) => {
                  console.log("Login response received:", data, headers);
                  try {
                    // 检查util对象是否存在且函数可用
                    if (typeof util !== 'undefined' && typeof util.saveAuthFromResponse === 'function') {
                      util.saveAuthFromResponse(data, headers);
                    } else {
                      // 手动处理认证信息存储
                      if (data) {
                        // 存储访问令牌
                        sessionStorage.setItem("accessToken", data);
                        sessionStorage.setItem("token", data);
                      }
                      // 从响应头中提取并存储其他认证信息
                      if (headers) {
                        const refreshToken = headers["refresh-token"];
                        const tokenType = headers["token-type"];
                        const expiresIn = headers["access-token-expires-in"];
                        if (refreshToken) {
                          sessionStorage.setItem("refreshToken", refreshToken);
                        }
                        if (tokenType) {
                          sessionStorage.setItem("tokenType", tokenType);
                        }
                        if (expiresIn) {
                          sessionStorage.setItem("accessTokenExpiresIn", expiresIn);
                        }
                      }
                    }
                    console.log("Auth saved, redirecting...");
                    // 延迟跳转，确保认证信息已存储
                    setTimeout(() => {
                      window.location.replace("/index.html");
                    }, 300);
                  } catch (e) {
                    console.error("Error during login process:", e);
                    this.$message.error("Login process error: " + e.message);
                  }
                })
                .catch(err => {
                  console.error("Login error:", err);
                  this.$message.error("Login failed: " + err);
                });
      },
      goBack() {
        history.back();
      },
      sendCode() {
        if (!this.form.phone) {
          this.$message.error("Phone is required");
          return;
        }
        axios.post("/user/code?phone=" + this.form.phone)
          .catch(err => this.$message.error(err));

        this.disabled = true;
        let i = 60;
        this.codeBtnMsg = (i--) + "s";
        let taskId = setInterval(() => {
          this.codeBtnMsg = (i--) + "s";
        }, 1000);
        setTimeout(() => {
          this.disabled = false;
          clearInterval(taskId);
          this.codeBtnMsg = "Send code";
        }, 59000);
      }
    }
  })
</script>
</body>
</html>
