name: hmdp-realtime

services:
  mysql:
    image: mysql:8.0.36
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
      - ./mysql/02-cdc-user.sql:/docker-entrypoint-initdb.d/02-cdc-user.sql:ro
    networks:
      analytics_net:

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}"]
    ports:
      - "6379:6379"
    networks:
      analytics_net:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      analytics_net:

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      analytics_net:

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "/opt/hmdp/init-kafka.sh"]
    volumes:
      - ./kafka/init-kafka.sh:/opt/hmdp/init-kafka.sh:ro
    networks:
      analytics_net:
    restart: "no"

  flink-volume-init:
    image: alpine:3.20
    user: "0:0"
    command: ["sh", "-c", "chown -R 9999:9999 /opt/flink/checkpoints /opt/flink/savepoints"]
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    networks:
      analytics_net:
    restart: "no"

  flink-jobmanager:
    build:
      context: ./docker/flink
    command: jobmanager
    depends_on:
      flink-volume-init:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
        state.backend.type: rocksdb
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy.type: failure-rate
        restart-strategy.failure-rate.max-failures-per-interval: 3
        restart-strategy.failure-rate.failure-rate-interval: 5 min
        restart-strategy.failure-rate.delay: 10 s
    ports:
      - "${FLINK_UI_PORT:-18081}:8081"
    volumes:
      - ./flink-sql:/opt/flink/sql:ro
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    networks:
      analytics_net:

  flink-taskmanager:
    build:
      context: ./docker/flink
    command: taskmanager
    depends_on:
      flink-volume-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 16
        parallelism.default: 2
        state.backend.type: rocksdb
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    networks:
      analytics_net:

  doris-fe:
    image: apache/doris:fe-2.1.9
    hostname: doris-fe
    environment:
      FE_SERVERS: fe1:172.28.0.10:9010
      FE_ID: 1
    ports:
      - "${DORIS_HTTP_PORT:-8030}:8030"
      - "${DORIS_QUERY_PORT:-9030}:9030"
    volumes:
      - doris_fe_meta:/opt/apache-doris/fe/doris-meta
      - doris_fe_log:/opt/apache-doris/fe/log
    networks:
      analytics_net:
        ipv4_address: 172.28.0.10

  doris-be:
    image: apache/doris:be-2.1.9
    hostname: doris-be
    depends_on:
      - doris-fe
    environment:
      FE_SERVERS: fe1:172.28.0.10:9010
      BE_ADDR: 172.28.0.11:9050
    ports:
      - "8040:8040"
    volumes:
      - doris_be_storage:/opt/apache-doris/be/storage
      - doris_be_log:/opt/apache-doris/be/log
    networks:
      analytics_net:
        ipv4_address: 172.28.0.11

  doris-init:
    image: mysql:8.0.36
    depends_on:
      - doris-fe
      - doris-be
    entrypoint: ["/bin/bash", "/opt/hmdp/init-doris.sh"]
    volumes:
      - ./doris/init-doris.sh:/opt/hmdp/init-doris.sh:ro
      - ./doris/01-schema.sql:/opt/hmdp/01-schema.sql:ro
    networks:
      analytics_net:
    restart: "no"

networks:
  analytics_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  mysql_data:
  kafka_data:
  flink_checkpoints:
  flink_savepoints:
  doris_fe_meta:
  doris_fe_log:
  doris_be_storage:
  doris_be_log:
